<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperTrail · Application tracker</title>
  <link rel="icon" href="../icons/icon32.png" />
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="logo big">P</span>
      <div>
        <h1 class="serif">PaperTrail</h1>
        <div class="tagline">Every application you send, logged automatically from any job site.</div>
      </div>
    </div>
    <div class="tools">
      <div class="search"><input id="q" class="field" type="search" placeholder="Search company, role, notes, or job descriptions" aria-label="Search" /></div>
      <div class="seg" role="tablist" aria-label="View">
        <button id="v-board" class="on" role="tab">Board</button>
        <button id="v-table" role="tab">Table</button>
      </div>
      <button class="btn" id="export">Export CSV</button>
      <div class="menu-wrap">
        <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">•••</button>
        <div class="menu" id="menu" hidden>
          <button data-m="demo">Load demo data</button>
          <button data-m="cleardemo">Remove demo data</button>
          <button data-m="settings">Settings</button>
          <hr />
          <button data-m="clear" class="danger">Delete everything</button>
        </div>
      </div>
    </div>
  </header>

  <section id="welcome" class="welcome" hidden></section>

  <section class="kpis" id="kpis"></section>
  <section class="pipeline" id="pipeline"></section>
  <section class="nudge" id="nudge" hidden></section>

  <main id="view"></main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2 class="serif">Settings</h2>
      <label class="row"><span><b>Detect submissions automatically</b><small>Logs an application when a confirmation page appears after you submit.</small></span><input type="checkbox" id="s-auto" /></label>
      <label class="row"><span><b>Show the on-page card</b><small>A small card on job postings with Save and I applied buttons.</small></span><input type="checkbox" id="s-card" /></label>
      <label class="row"><span><b>Follow-up reminder</b><small>Flag applications with no update after this many days.</small></span><input type="number" min="3" max="60" id="s-days" class="field" style="width:70px" /></label>
      <p class="privacy">🔒 Everything is stored in this browser only. PaperTrail has no account, no server, and never reads your email.</p>
      <div class="actions"><button class="btn primary" value="save" id="s-save">Done</button></div>
    </form>
  </dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
